<mat-toolbar color="primary">
  <button  class="drop-down-button" mat-icon-button (click)="sidenav.toggle()" matTooltip="Menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Campusday - Admin Panel</span>
  <span class="toolbar-item-spacer"></span>
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" [class.mat-elevation-z4]="true" class="app-sidenav">
    <mat-nav-list>
      <mat-expansion-panel [class.mat-elevation-z0]="true">
        <mat-expansion-panel-header>
          Einstellungen
        </mat-expansion-panel-header>
        <mat-nav-list>
          <a mat-list-item routerLink="#">
            <span (click)="this.setUserList()">Benutzer</span>
          </a>
          <a mat-list-item routerLink="#">
            <span (click)="this.setStationList()">Stationen</span>
          </a>
        </mat-nav-list>
      </mat-expansion-panel>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet>
      <div class="app-sidenav-content">

        <!--        Components open here-->

        <app-userlist *ngIf="this.contentComponent == ContentComponent.USERLIST"></app-userlist>
        <app-stationlist  *ngIf="this.contentComponent == ContentComponent.STATIONLIST"></app-stationlist>

      </div>
    </router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
