<div class="station-display-container">
  <!-- Stationsliste -->
  <div *ngIf="this.isLoaded" class="station-list-container">
    <div *ngFor="let station of this.globalConfig.STATIONS">
        <div class="empty-circle-with-text">
          <div class="empty-circle"></div>
          <span>{{station.name}}</span>
        </div>
    </div>
  </div>
</div>
