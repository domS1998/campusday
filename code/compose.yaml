name : campus_day_app
version: '1'

networks:
  campus_day_app:  # Define the custom network
    driver: bridge    # Use the bridge driver

services:

  # nginx reverse proxy
  reverse-proxy:
    image: nginx:latest
    depends_on:
      - webclient
      - rest-service
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf
    networks: # attach to custom bridge network
      - campus_day_app
    hostname: reverse-proxy # set custom DNS name within bridge network
    expose:
      - 80  # open port within container
    ports:
      - "80:80"
    container_name: reverse-proxy
    restart: always

  # angular client app + nginx webserver
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    networks: # attach to custom bridge network
      - campus_day_app
    hostname: dashboard # set custom DNS name within bridge network
    expose:
      - 82  # open port within container
    ports:
      - "4201:82" # forword port 80 on bridge network to port 4200 on host
    container_name: dashboard
    restart: always

  # angular client app + nginx webserver
  webclient:
    build:
#      context: ./webclient
      context: ./ui
      dockerfile: Dockerfile
    networks: # attach to custom bridge network
      - campus_day_app
    hostname: webclient # set custom DNS name within bridge network
    expose:
      - 81  # open port within container
    ports:
      - "4200:81" # forword port 80 on bridge network to port 4200 on host
    container_name: webclient
    restart: always

  # datenbank
  postgres:
    image:               postgres:15
    container_name:      datenbank
    restart:             unless-stopped
    networks:
      - campus_day_app
    hostname:            database
    expose:
      # Containerport 5432 öffnen
      - 5432
    ports:
      # Containerport 5432 auf Hostport 5000 mappen
      # auskommentieren, damit DB nicht mehr über localhost zugänglich ist
      # anschalten, um DB über localhost zu debuggen / testen
      - "5000:5432"
    environment:
      # implizit neu zu erstellender Nutzer, Password und Datenbank
      POSTGRES_USER:     campus_day_app
      POSTGRES_PASSWORD: campus_day_app
      POSTGRES_DB:       campus_day_app
#    volumes:
      # Datenbankinhalt
#      - data:/var/lib/postgresql/data


  # server
  rest-service:
    image:               rest-service
    container_name:      rest-service
    restart:             unless-stopped
    build:
      context: ./campus-day-webservice
      dockerfile: Dockerfile
    networks:
      - campus_day_app
    hostname:            rest-service
    expose:
      - 8080
    ports:
      - "8080:8080"

volumes:
  data: {}
