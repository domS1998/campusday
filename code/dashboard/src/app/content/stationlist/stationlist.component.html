<!-- user-list.component.html -->

<!-- Add User Button -->
<!--  <button mat-raised-button color="primary" (click)="addUser()">Add User</button>-->
<div *ngIf="this.isLoaded" class="container">

  <!-- Font Awesome CDN for buttons-->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <table matSort mat-table [dataSource]="this.stations" class="mat-elevation-z8">

    <ng-container matColumnDef="Name">
      <th mat-sort-header mat-header-cell *matHeaderCellDef> Name</th>
      <td mat-cell *matCellDef="let element">{{element.name}}</td>
    </ng-container>

    <ng-container matColumnDef="Nummer">
      <th mat-sort-header mat-header-cell *matHeaderCellDef> Nummer</th>
      <td mat-cell *matCellDef="let element">{{element.number}}</td>
    </ng-container>

    <ng-container matColumnDef="Stockwerk">
      <th mat-sort-header mat-header-cell *matHeaderCellDef> Stockwerk</th>
      <td mat-cell *matCellDef="let element">{{element.location.image}}</td>
    </ng-container>

    <ng-container matColumnDef="Offset-X">
      <th mat-sort-header mat-header-cell *matHeaderCellDef> Offset-X</th>
      <td mat-cell *matCellDef="let element">{{element.location.xcoordinate}}</td>
    </ng-container>

    <ng-container matColumnDef="Offset-Y">
      <th mat-sort-header mat-header-cell *matHeaderCellDef> Offset-Y</th>
      <td mat-cell *matCellDef="let element">{{element.location.ycoordinate}}</td>
    </ng-container>

    <ng-container matColumnDef="Aktionen">
      <th mat-header-cell *matHeaderCellDef>Aktionen</th>
      <td mat-cell *matCellDef="let element">
        <button class="icon-button delete" (click)="this.deleteUser(element.name)">
          <span class="material-icons">delete</span>
        </button>
        <button class="icon-button edit">
          <span class="material-icons" (click)="this.openUpdateStationDialog(element)">edit</span>
        </button>
        <button class="icon-button details">
          <span class="material-icons">search</span>
        </button>
      </td>
    </ng-container>

    <!-- 👇 THIS IS WHAT WAS LIKELY MISSING -->
    <tr mat-header-row *matHeaderRowDef="this.displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: this.displayedColumns;"></tr>

  </table>

  <button class="round-add-button" mat-raised-button (click)="this.openAddStationDialog()">
    <mat-icon style="color: white;">add</mat-icon>
  </button>

  <!--    <button mat-icon-button style="background-color: #3f51b5; border-radius: 50%;">-->
  <!--    </button>-->

</div>
